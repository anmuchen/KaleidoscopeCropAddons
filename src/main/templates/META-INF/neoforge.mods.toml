modLoader="javafml"
loaderVersion="${loader_version_range}"
license="GPL 3.0"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="森罗物语：作物附属"
authors="XiaoLiang小亮 & 安沐尘"
logoFile="logo.png"
description='''
森罗物语（Kaleidoscope）：作物附属。
把森罗物语系列模组的作物接入农田盒，由雇佣农民统一种植、收割与补种。

收录 10 个来源、21 种作物：
· 森罗物语：厨房 —— 番茄、辣椒、生菜
· 森罗厨房：国味 —— 茄子
· 森罗：炙烤 —— 油菜、洋葱、红薯、折耳根
· 森罗物语：酒馆 —— 葡萄、冰葡萄、黄金葡萄
· 森罗物语：次元酒窖 —— 啤酒花、绯红葡萄、诡异葡萄
· 森罗物语：果园 —— 草莓、蓝莓
· 森罗物语：末地 —— 末影薄荷（长在末地石上）
· 森罗物语：下界 —— 灵魂辣椒、迷毒果（长在灵魂沙上）
· 森罗物语：幽匿 —— 回响作物（长在幽匿催发体上）
· 森罗物语：暮色 —— 蕨菜

葡萄类沿用藤架，由农民自己立柱搭架。
自定义土壤作物（末影薄荷、灵魂辣椒、迷毒果、回响作物）不需要水渠，整块地都会种满。

未安装的源模组会自动跳过，不影响启动。
新增其它森罗模组的作物时，在 data/kaleidoscopecropaddons/kaleidoscope_crops/ 放一份 JSON 即可。
'''

